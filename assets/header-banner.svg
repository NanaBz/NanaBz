<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Nanakwaku Boakye-Akyeampong  Aspiring Data Scientist, Creative Problem Solver, Builder">
  <defs>
